<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вращающийся куб</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        .scene {
            width: 250px;
            height: 250px;
            perspective: 800px;
        }

        .cube {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            animation: rotate 8s infinite linear;
        }

        .cube__face {
            position: absolute;
            width: 250px;
            height: 250px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.1);
        }

        .cube__face--front  { 
            background: rgba(255, 107, 107, 0.7); 
            transform: rotateY(0deg) translateZ(125px); 
        }
        .cube__face--right  { 
            background: rgba(78, 205, 196, 0.7); 
            transform: rotateY(90deg) translateZ(125px); 
        }
        .cube__face--back   { 
            background: rgba(69, 183, 209, 0.7); 
            transform: rotateY(180deg) translateZ(125px); 
        }
        .cube__face--left   { 
            background: rgba(150, 206, 180, 0.7); 
            transform: rotateY(-90deg) translateZ(125px); 
        }
        .cube__face--top    { 
            background: rgba(255, 195, 113, 0.7); 
            transform: rotateX(90deg) translateZ(125px); 
        }
        .cube__face--bottom { 
            background: rgba(200, 140, 255, 0.7); 
            transform: rotateX(-90deg) translateZ(125px); 
        }

        @keyframes rotate {
            0% {
                transform: rotateX(0deg) rotateY(0deg);
            }
            100% {
                transform: rotateX(360deg) rotateY(360deg);
            }
        }

        .title {
            position: absolute;
            top: 50px;
            color: white;
            font-size: 32px;
            text-align: center;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
            letter-spacing: 3px;
        }

        .glow {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            animation: pulse 4s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 0.5;
            }
            50% {
                transform: scale(1.2);
                opacity: 0.8;
            }
        }
    </style>
</head>
<body>
    <div class="glow"></div>
    <h1 class="title">3D КУБ</h1>
    
    <div class="scene">
        <div class="cube">
            <div class="cube__face cube__face--front">1</div>
            <div class="cube__face cube__face--back">2</div>
            <div class="cube__face cube__face--right">3</div>
            <div class="cube__face cube__face--left">4</div>
            <div class="cube__face cube__face--top">5</div>
            <div class="cube__face cube__face--bottom">6</div>
        </div>
    </div>
</body>
</html>
